name: Host Tests CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake git g++

      - name: Build and install GoogleTest from source
        run: |
          git clone --depth 1 https://github.com/google/googletest ~/googletest
          cmake -S ~/googletest -B ~/googletest/build \
            -DCMAKE_INSTALL_PREFIX=$HOME/.local \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build ~/googletest/build -j$(nproc)
          cmake --install ~/googletest/build

      - name: Verify GoogleTest installation
        run: |
          ls $HOME/.local/lib/libgtest.a
          ls $HOME/.local/lib/libgtest_main.a
          ls $HOME/.local/include/gtest/gtest.h

      - name: Build and run host-side tests
        run: make test
