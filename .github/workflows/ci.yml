name: Host Tests CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake git g++

      - name: Build and install GoogleTest from source
        run: |
          git clone --depth 1 https://github.com/google/googletest ~/googletest
          cmake -S ~/googletest -B ~/googletest/build \
            -DCMAKE_INSTALL_PREFIX=$HOME/.local \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build ~/googletest/build -j$(nproc)
          cmake --install ~/googletest/build
          echo "--- installed files ---"
          find $HOME/.local -name "*.h" | grep gtest | head -10
          find $HOME/.local -name "libgtest*" | head -10

      - name: Build and run host-side tests
        run: |
          GTEST_INC=$(find $HOME/.local -name "gtest.h" -path "*/gtest/gtest.h" | head -1 | xargs dirname | xargs dirname)
          GTEST_LIB=$(find $HOME/.local -name "libgtest_main.a" | head -1 | xargs dirname)
          echo "GTEST_INC=$GTEST_INC"
          echo "GTEST_LIB=$GTEST_LIB"
          make test GTEST_INC="-I${GTEST_INC}" GTEST_LIB="-L${GTEST_LIB} -lgtest -lgtest_main -lpthread"
